<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的日历 - 每日任务管理</title>
<style>
  :root {
    --bg: #f0f2f5;
    --card: #ffffff;
    --primary: #4f7cff;
    --primary-light: #e8efff;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --today: #ff6b6b;
    --task-dot: #4f7cff;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 40px rgba(0,0,0,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* 顶部栏 */
  .header {
    background: var(--card);
    box-shadow: var(--shadow);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .logo {
    font-size: 24px;
  }

  .header h1 {
    font-size: 20px;
    font-weight: 700;
  }

  .header-actions { display: flex; gap: 10px; align-items: center; }

  .nav-btn, .today-btn, .add-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 15px;
    color: var(--text-secondary);
    padding: 8px 14px;
    border-radius: 8px;
    transition: all 0.2s;
  }

  .nav-btn:hover, .today-btn:hover { background: var(--primary-light); color: var(--primary); }

  .today-btn { font-weight: 600; color: var(--primary); }

  .add-btn {
    background: var(--primary);
    color: #fff;
    font-weight: 600;
    padding: 8px 18px;
  }
  .add-btn:hover { background: #3a63e0; }

  /* 主容器 */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* 月份标题 */
  .month-title {
    text-align: center;
    margin-bottom: 24px;
  }
  .month-title h2 {
    font-size: 28px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .month-nav {
    display: flex;
    align-items: center;
    gap: 20px;
    justify-content: center;
  }
  .month-nav button {
    background: var(--card);
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    color: var(--primary);
    box-shadow: var(--shadow);
    transition: all 0.2s;
  }
  .month-nav button:hover { background: var(--primary); color: #fff; }

  /* 日历网格 */
  .calendar-card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 24px;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }

  .weekdays div {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 8px 0;
  }
  .weekdays div:first-child, .weekdays div:last-child {
    color: var(--today);
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }

  .day-cell {
    aspect-ratio: 1;
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    transition: all 0.18s;
    position: relative;
    background: #fafafa;
    min-height: 72px;
  }

  .day-cell:hover {
    border-color: var(--primary);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }

  .day-cell.other-month {
    opacity: 0.3;
    background: transparent;
  }
  .day-cell.other-month:hover { opacity: 0.6; }

  .day-cell.today {
    background: var(--primary-light);
    border-color: var(--primary);
  }

  .day-number {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .day-cell.today .day-number {
    color: var(--primary);
  }

  .day-cell.weekend .day-number {
    color: var(--today);
  }

  .task-preview {
    flex: 1;
    width: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .task-tag {
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--primary-light);
    color: var(--primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
  }

  .task-tag.done {
    text-decoration: line-through;
    opacity: 0.5;
  }

  .more-tasks {
    font-size: 10px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* 空状态 */
  .empty-hint {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    font-size: 11px;
    color: #ccc;
  }

  /* 侧边面板 */
  .side-panel {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 24px;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .panel-header h3 { font-size: 18px; }

  .panel-date {
    font-size: 15px;
    color: var(--text-secondary);
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  /* 任务列表 */
  .task-list { display: flex; flex-direction: column; gap: 10px; }

  .task-empty {
    text-align: center;
    color: var(--text-secondary);
    padding: 40px 0;
    font-size: 14px;
  }

  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px;
    background: #f9f9fb;
    border-radius: 10px;
    transition: all 0.2s;
  }
  .task-item:hover { background: var(--primary-light); }

  .task-check {
    width: 22px;
    height: 22px;
    border: 2px solid var(--primary);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.2s;
  }
  .task-check:hover { background: var(--primary); }
  .task-check.checked {
    background: var(--primary);
  }
  .task-check.checked::after {
    content: '✓';
    color: #fff;
    font-size: 14px;
    font-weight: bold;
  }

  .task-body { flex: 1; min-width: 0; }

  .task-text {
    font-size: 15px;
    line-height: 1.5;
    word-break: break-word;
  }
  .task-item.done .task-text {
    text-decoration: line-through;
    color: var(--text-secondary);
  }

  .task-time {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .task-delete {
    background: none;
    border: none;
    color: #ccc;
    cursor: pointer;
    font-size: 18px;
    padding: 0 4px;
    flex-shrink: 0;
    transition: color 0.2s;
  }
  .task-delete:hover { color: var(--today); }

  /* 添加任务表单 */
  .add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .add-form input[type="text"] {
    flex: 1;
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border 0.2s;
  }
  .add-form input[type="text"]:focus { border-color: var(--primary); }
  .add-form input[type="time"] {
    padding: 10px 8px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    width: 90px;
  }
  .add-form button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .add-form button:hover { background: #3a63e0; }

  /* 布局 */
  .main-layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 24px;
  }

  @media (max-width: 900px) {
    .main-layout { grid-template-columns: 1fr; }
  }

  /* 统计条 */
  .stats-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat-item {
    background: var(--card);
    padding: 14px 20px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--primary); }
  .stat-label { font-size: 13px; color: var(--text-secondary); }

  /* 底部说明 */
  .footer-note {
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
    margin-top: 32px;
    padding: 20px;
  }

  /* 移动端 */
  @media (max-width: 600px) {
    .header { padding: 14px 16px; }
    .header h1 { font-size: 17px; }
    .container { padding: 16px 12px 40px; }
    .calendar-card { padding: 14px; }
    .day-cell { padding: 5px; min-height: 58px; }
    .day-number { font-size: 14px; }
    .task-tag { font-size: 10px; }
    .month-title h2 { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="logo">📅</span>
    <h1>我的日历</h1>
  </div>
  <div class="header-actions">
    <button class="today-btn" onclick="goToday()">回到今天</button>
    <button class="add-btn" onclick="openAddForToday()">+ 添加任务</button>
  </div>
</div>

<div class="container">
  <div class="month-title">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <h2 id="monthLabel"></h2>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <div class="stats-bar" id="statsBar"></div>

  <div class="main-layout">
    <div class="calendar-card">
      <div class="weekdays">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
      </div>
      <div class="days-grid" id="daysGrid"></div>
    </div>

    <div class="side-panel">
      <div class="panel-header">
        <h3>当日任务</h3>
      </div>
      <div class="panel-date" id="panelDate"></div>
      <div class="task-list" id="taskList"></div>
      <div class="add-form">
        <input type="text" id="taskInput" placeholder="输入任务内容..." maxlength="100">
        <input type="time" id="taskTime">
        <button onclick="addTask()">添加</button>
      </div>
    </div>
  </div>

  <div class="footer-note">
    数据保存在本地浏览器中，关闭页面也不会丢失 · 可离线使用
  </div>
</div>

<script>
const STORAGE_KEY = 'myCalendarTasks_v1';

let state = {
  viewDate: new Date(),      // 当前查看的月份
  selectedDate: new Date(),  // 侧边栏选中的日期
  tasks: loadTasks()
};

// ========== 数据存取 ==========
function loadTasks() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}

function saveTasks() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks));
}

// 日期转 key: yyyy-mm-dd
function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}

function formatDateChinese(d) {
  const weekDays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${weekDays[d.getDay()]}`;
}

// ========== 日历渲染 ==========
function renderCalendar() {
  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';

  const year = state.viewDate.getFullYear();
  const month = state.viewDate.getMonth();
  document.getElementById('monthLabel').textContent = `${year}年 ${month + 1}月`;

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startOffset = firstDay.getDay(); // 本月1号是星期几
  const totalDays = lastDay.getDate();

  const today = new Date();

  // 上月填充
  const prevLastDay = new Date(year, month, 0).getDate();
  for (let i = startOffset - 1; i >= 0; i--) {
    const d = new Date(year, month - 1, prevLastDay - i);
    grid.appendChild(createDayCell(d, true, today));
  }

  // 本月
  for (let i = 1; i <= totalDays; i++) {
    const d = new Date(year, month, i);
    grid.appendChild(createDayCell(d, false, today));
  }

  // 下月填充至 6 行 (42 格) 或至少铺满当前行
  const filled = startOffset + totalDays;
  const remaining = filled <= 35 ? 35 - filled : 42 - filled;
  for (let i = 1; i <= remaining; i++) {
    const d = new Date(year, month + 1, i);
    grid.appendChild(createDayCell(d, true, today));
  }

  renderStats();
}

function createDayCell(date, isOtherMonth, today) {
  const cell = document.createElement('div');
  cell.className = 'day-cell';
  if (isOtherMonth) cell.classList.add('other-month');
  if (isSameDay(date, today)) cell.classList.add('today');
  if (date.getDay() === 0 || date.getDay() === 6) cell.classList.add('weekend');

  const numDiv = document.createElement('div');
  numDiv.className = 'day-number';
  numDiv.textContent = date.getDate();
  cell.appendChild(numDiv);

  const preview = document.createElement('div');
  preview.className = 'task-preview';
  const dayTasks = state.tasks[dateKey(date)] || [];
  const undone = dayTasks.filter(t => !t.done);

  if (dayTasks.length > 0) {
    const showCount = Math.min(3, dayTasks.length);
    for (let i = 0; i < showCount; i++) {
      const tag = document.createElement('div');
      tag.className = 'task-tag';
      if (dayTasks[i].done) tag.classList.add('done');
      tag.textContent = (dayTasks[i].time ? dayTasks[i].time + ' ' : '') + dayTasks[i].text;
      preview.appendChild(tag);
    }
    if (dayTasks.length > 3) {
      const more = document.createElement('div');
      more.className = 'more-tasks';
      more.textContent = `+${dayTasks.length - 3} 更多`;
      preview.appendChild(more);
    }
  } else {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = '·';
    preview.appendChild(hint);
  }
  cell.appendChild(preview);

  cell.addEventListener('click', () => selectDate(date));
  return cell;
}

// ========== 侧边面板 ==========
function selectDate(date) {
  state.selectedDate = new Date(date);
  renderSidePanel();
}

function renderSidePanel() {
  document.getElementById('panelDate').textContent = formatDateChinese(state.selectedDate);

  const list = document.getElementById('taskList');
  list.innerHTML = '';

  const dayTasks = state.tasks[dateKey(state.selectedDate)] || [];

  if (dayTasks.length === 0) {
    list.innerHTML = '<div class="task-empty">这一天还没有任务<br>在下方添加你的计划吧</div>';
    return;
  }

  // 按时间排序
  dayTasks.sort((a, b) => {
    if (!a.time) return 1;
    if (!b.time) return -1;
    return a.time.localeCompare(b.time);
  });

  dayTasks.forEach((task, idx) => {
    const item = document.createElement('div');
    item.className = 'task-item';
    if (task.done) item.classList.add('done');

    const check = document.createElement('div');
    check.className = 'task-check';
    if (task.done) check.classList.add('checked');
    check.addEventListener('click', () => toggleTask(idx));

    const body = document.createElement('div');
    body.className = 'task-body';
    const textEl = document.createElement('div');
    textEl.className = 'task-text';
    textEl.textContent = task.text;
    body.appendChild(textEl);
    if (task.time) {
      const timeEl = document.createElement('div');
      timeEl.className = 'task-time';
      timeEl.textContent = '⏰ ' + task.time;
      body.appendChild(timeEl);
    }

    const del = document.createElement('button');
    del.className = 'task-delete';
    del.textContent = '×';
    del.addEventListener('click', () => deleteTask(idx));

    item.appendChild(check);
    item.appendChild(body);
    item.appendChild(del);
    list.appendChild(item);
  });
}

// ========== 任务操作 ==========
function addTask() {
  const input = document.getElementById('taskInput');
  const timeInput = document.getElementById('taskTime');
  const text = input.value.trim();
  if (!text) return;

  const key = dateKey(state.selectedDate);
  if (!state.tasks[key]) state.tasks[key] = [];

  state.tasks[key].push({
    text: text,
    time: timeInput.value || '',
    done: false,
    created: Date.now()
  });

  saveTasks();
  input.value = '';
  timeInput.value = '';
  renderSidePanel();
  renderCalendar();
}

function toggleTask(index) {
  const key = dateKey(state.selectedDate);
  if (!state.tasks[key]) return;
  state.tasks[key][index].done = !state.tasks[key][index].done;
  saveTasks();
  renderSidePanel();
  renderCalendar();
}

function deleteTask(index) {
  const key = dateKey(state.selectedDate);
  if (!state.tasks[key]) return;
  state.tasks[key].splice(index, 1);
  if (state.tasks[key].length === 0) delete state.tasks[key];
  saveTasks();
  renderSidePanel();
  renderCalendar();
}

// ========== 导航 ==========
function changeMonth(delta) {
  state.viewDate = new Date(state.viewDate.getFullYear(), state.viewDate.getMonth() + delta, 1);
  renderCalendar();
}

function goToday() {
  const today = new Date();
  state.viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
  state.selectedDate = today;
  renderCalendar();
  renderSidePanel();
}

function openAddForToday() {
  goToday();
  document.getElementById('taskInput').focus();
}

// ========== 统计 ==========
function renderStats() {
  const bar = document.getElementById('statsBar');
  const today = new Date();
  const todayKey = dateKey(today);

  let todayTotal = (state.tasks[todayKey] || []).length;
  let todayDone = (state.tasks[todayKey] || []).filter(t => t.done).length;

  // 本月统计
  const year = state.viewDate.getFullYear();
  const month = state.viewDate.getMonth();
  let monthTotal = 0, monthDone = 0;
  Object.keys(state.tasks).forEach(k => {
    const [y, m] = k.split('-').map(Number);
    if (y === year && m === month + 1) {
      monthTotal += state.tasks[k].length;
      monthDone += state.tasks[k].filter(t => t.done).length;
    }
  });

  bar.innerHTML = `
    <div class="stat-item">
      <span class="stat-num">${todayDone}/${todayTotal}</span>
      <span class="stat-label">今日完成</span>
    </div>
    <div class="stat-item">
      <span class="stat-num">${monthDone}/${monthTotal}</span>
      <span class="stat-label">本月完成</span>
    </div>
    <div class="stat-item">
      <span class="stat-num">${Object.keys(state.tasks).length}</span>
      <span class="stat-label">有任务的日期</span>
    </div>
  `;
}

// ========== 事件绑定 ==========
document.getElementById('taskInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

// 初始化
goToday();
</script>

</body>
</html>
